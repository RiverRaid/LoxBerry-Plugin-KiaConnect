[HELP]
ABOUT_TITLE=Über Kia2Lox
ABOUT_TEXT_1=Kia2Lox fragt regelmäßig den Ladezustand eines oder mehrerer Kia-e-Fahrzeuge über die (inoffizielle) Kia-Connect-Schnittstelle ab und schickt die Werte per UDP an einen Loxone Miniserver.
ABOUT_TEXT_2="Die Verbindung zu Kia Connect selbst übernimmt die freie Bibliothek <a href="https://github.com/Hyundai-Kia-Connect/hyundai_kia_connect_api" target="_blank" rel="noopener"><code>hyundai_kia_connect_api</code></a> von Fuat Akgun (MIT-Lizenz) - ohne dieses Projekt gäbe es Kia2Lox nicht, vielen Dank dafür!"
VERSION_LABEL=Version
GITHUB_LINK=Kia2Lox auf GitHub →

GETTING_STARTED_TITLE=Erste Schritte
GETTING_STARTED_INTRO=Pro Fahrzeug in den <strong>Einstellungen</strong>:
STEP_1=<strong>Kia Connect Zugangsdaten</strong>: dieselben Zugangsdaten wie in der Kia-Connect-App eingeben und speichern. Beim Speichern wird der Login sofort getestet - erst nach einem erfolgreichen Test ist das Fahrzeug "verbunden" und alle weiteren Karten werden freigeschaltet.
STEP_2="<strong>Loxone Miniserver</strong>: Ziel-Miniserver und UDP-Port auswählen, an den die Werte gesendet werden sollen."
STEP_3="<strong>Abfrage-Intervall</strong>: festlegen, wie oft passiv abgefragt wird und ob zusätzlich ein Force-Refresh (weckt das Fahrzeug aktiv) stattfinden soll."
STEP_4="<strong>Loxone Vorlagen</strong> herunterladen und in Loxone Config importieren - Adresse, Port und Schlüssel sind bereits eingetragen."
MAX_VEHICLES_TEXT="Bis zu {max} Fahrzeuge können über "+ Fahrzeug" oben angelegt werden, jedes mit eigenen Zugangsdaten, Miniserver-Ziel und Intervall."

PASSIVE_TITLE=Passive Abfrage vs. Force-Refresh
PASSIVE_INTRO="Kia2Lox unterscheidet zwei Arten der Abfrage, die unabhängig voneinander eingestellt werden:"
PASSIVE_ITEM="<strong>Passive Abfrage</strong>: liest nur den zuletzt von Kia Connect gemeldeten (gecachten) Stand. Weckt das Fahrzeug nicht auf, belastet die 12V-Batterie nicht zusätzlich - daher für häufige Abfragen geeignet."
FORCE_ITEM=<strong>Force-Refresh</strong>: fordert einen frischen Stand direkt vom Fahrzeug an. Weckt das Fahrzeug aktiv auf und verbraucht dabei etwas 12V-Batterie - daher nur 0-4× täglich zu festen Uhrzeiten vorgesehen (oder manuell über den "Jetzt aktualisieren"-Button bzw. den HTTP-Trigger).

UDP_TITLE=Gesendete UDP-Werte
UDP_INTRO=Bei jeder Abfrage werden folgende Werte als einzelne UDP-Telegramme im Format <code>SCHLÜSSEL=WERT</code> gesendet:
TABLE_KEY=Schlüssel
TABLE_MEANING=Bedeutung
ROW_SOC=Ladezustand in Prozent (0-100)
ROW_RANGE=Elektrische Reichweite in km
ROW_CHARGING="1 = lädt gerade, 0 = lädt nicht"
ROW_PLUGGED="Steckerstatus (0 = nicht eingesteckt, 2 = eingesteckt, ggf. weitere Werte je nach Fahrzeug)"
ROW_FULL=1 = Akku ist seit mind. 3 Stunden ununterbrochen ≥99 %
ROW_FULLPARKED=1 = zusätzlich seit mind. 3 Stunden eingesteckt und nicht mehr ladend
ROW_RECHARGE100=1 = seit 30 Tagen keinen vollen Ladestand mehr erreicht (Zellausgleich empfohlen)
ROW_LOWBATTERY=1 = Akku ist seit mind. 3 Stunden ununterbrochen unter 10 % und lädt nicht
UDP_OUTRO="Alle Werte werden bei jeder Abfrage gesendet, unabhängig davon, ob sie sich geändert haben - das dient gleichzeitig als "Lebenszeichen", dass die Abfrage noch läuft."

HTTP_TITLE=HTTP-Befehle &amp; Loxone-Vorlagen
HTTP_TEXT_1="Auf der Einstellungsseite finden sich zwei Adressen (Passive Abfrage / Force-Refresh), die als HTTP-Befehl in einem virtuellen Ausgang in Loxone Config hinterlegt werden können, um eine Abfrage direkt aus Loxone auszulösen - z. B. per Zeitschaltung oder Taster. Jedes Fahrzeug hat dabei einen eigenen Sicherheits-Schlüssel; kein LoxBerry-Login nötig, der Schlüssel sollte aber nicht weitergegeben werden."
HTTP_TEXT_2="Die "Loxone Vorlagen" auf derselben Seite sind fertig ausgefüllte Import-Dateien für Loxone Config - ein virtueller UDP-Eingang (empfängt die Werte oben) und ein virtueller Ausgang (löst die HTTP-Befehle aus), jeweils bereits mit Adresse, Port und Schlüssel des jeweiligen Fahrzeugs befüllt."

OVERVIEW_LOG_TITLE=Übersicht &amp; Log
OVERVIEW_TEXT="Die <strong>Übersicht</strong> zeigt den aktuellen Stand des ausgewählten Fahrzeugs (Ladezustand, Steckerstatus, letzte/nächste Abfrage, Miniserver-Erreichbarkeit) sowie ein Diagramm des Ladeverlaufs. Über das Zahnrad-Symbol oben rechts können einzelne Boxen ein-/ausgeblendet werden."
LOG_TEXT=Das <strong>Log</strong> zeigt das Protokoll aller Abfrage-Versuche (alle Fahrzeuge zusammen) und kann bei Bedarf geleert werden.

