[HELP]
ABOUT_TITLE=About Kia2Lox
ABOUT_TEXT_1=Kia2Lox regularly polls the charge status of one or more Kia EVs via the (unofficial) Kia Connect interface and sends the values to a Loxone Miniserver over UDP.
ABOUT_TEXT_2="The connection to Kia Connect itself is handled by the free library <a href="https://github.com/Hyundai-Kia-Connect/hyundai_kia_connect_api" target="_blank" rel="noopener"><code>hyundai_kia_connect_api</code></a> by Fuat Akgun (MIT license) - without this project Kia2Lox wouldn't exist, thank you!"
VERSION_LABEL=Version
GITHUB_LINK=Kia2Lox on GitHub →

GETTING_STARTED_TITLE=Getting started
GETTING_STARTED_INTRO="Per vehicle, in <strong>Settings</strong>:"
STEP_1=<strong>Kia Connect credentials</strong>: enter the same credentials as in the Kia Connect app and save. Saving tests the login immediately - only after a successful test is the vehicle "connected" and the remaining cards unlocked.
STEP_2=<strong>Loxone Miniserver</strong>: choose the target Miniserver and UDP port the values should be sent to.
STEP_3=<strong>Polling interval</strong>: set how often passive polling happens and whether an additional force refresh (actively wakes the vehicle) should occur.
STEP_4="Download the <strong>Loxone templates</strong> and import them into Loxone Config - address, port and key are already filled in."
STEP_5="<strong>Warnings</strong> (optional, collapsible box under Polling interval): adjust the thresholds for the battery-care hints (full, cell balancing, low battery) - the default values are already sensible."
MAX_VEHICLES_TEXT="Up to {max} vehicles can be added via "+ Vehicle" above, each with its own credentials, Miniserver target and interval."

PASSIVE_TITLE=Passive polling vs. force refresh
PASSIVE_INTRO="Kia2Lox distinguishes two kinds of polling, configured independently of each other:"
PASSIVE_ITEM="<strong>Passive polling</strong>: only reads the last status reported to Kia Connect (cached). Doesn't wake the vehicle, doesn't put extra strain on the 12V battery - suitable for frequent polling."
FORCE_ITEM=<strong>Force refresh</strong>: requests a fresh status directly from the vehicle. Actively wakes the vehicle and uses some 12V battery in the process - therefore only intended 0-4× daily at fixed times (or manually via the "Refresh now" button or the HTTP trigger).

UDP_TITLE=UDP values sent
UDP_INTRO=Each poll sends the following values as individual UDP telegrams in the format <code>KEY=VALUE</code>:
TABLE_KEY=Key
TABLE_MEANING=Meaning
ROW_SOC=Charge level in percent (0-100)
ROW_RANGE=Electric range in km
ROW_CHARGING="1 = currently charging, 0 = not charging"
ROW_PLUGGED="Plug status (0 = not plugged in, 2 = plugged in, possibly other values depending on the vehicle)"
ROW_FULL=1 = battery has been continuously above the configurable threshold (default: 99 %) for a configurable time (default: 3 hours) - see "Warnings" in Settings
ROW_FULLPARKED=1 = additionally plugged in and no longer charging for a configurable time (default: 3 hours) - see "Warnings"
ROW_RECHARGE100=1 = hasn't reached a full charge in a configurable number of days (default: 30) (cell balancing recommended) - see "Warnings"
ROW_LOWBATTERY=1 = battery has been continuously below the configurable threshold (default: 10 %) for a configurable time (default: 3 hours) and is not charging - see "Warnings"
UDP_OUTRO="All values are sent on every poll, whether they have changed or not - this also serves as a "heartbeat" that polling is still running."

HTTP_TITLE=HTTP commands &amp; Loxone templates
HTTP_TEXT_1="The settings page has two addresses (passive polling / force refresh) that can be set as an HTTP command in a virtual output in Loxone Config to trigger a poll directly from Loxone - e.g. via a time switch or a push button. Each vehicle has its own security key; no LoxBerry login is needed, but the key should not be shared."
HTTP_TEXT_2="The "Loxone templates" on the same page are ready-to-import files for Loxone Config - a virtual UDP input (receives the values above) and a virtual output (triggers the HTTP commands), each already filled in with the address, port and key of the respective vehicle."

OVERVIEW_LOG_TITLE=Overview &amp; Log
OVERVIEW_TEXT="The <strong>Overview</strong> shows the current status of the selected vehicle (charge level, plug status, last/next poll, Miniserver reachability) as well as a chart of the charge history. The gear icon in the top right can show or hide individual boxes."
LOG_TEXT=The <strong>Log</strong> shows the log of all polling attempts (all vehicles combined) and can be cleared if needed.

