[HELP]
TITLE=Kia2Lox - Help
TEXT_1="This plugin reads the charge status of up to four Kia/Hyundai EVs via Kia Connect and sends the values to a Loxone Miniserver over UDP - including polling intervals, HTTP triggers for Loxone and ready-made Loxone templates."
TEXT_2=A detailed guide is available directly in the plugin under the <strong>Help</strong> tab.
TEXT_3=Source code and more information: <a href="https://github.com/RiverRaid/LoxBerry-Plugin-KiaConnect" target="_blank">GitHub repository</a>
