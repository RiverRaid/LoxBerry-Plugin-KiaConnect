[HELP]
TITLE=Kia2Lox - Hilfe
TEXT_1="Dieses Plugin liest den Ladezustand von bis zu vier Kia/Hyundai-Elektroautos ueber Kia Connect aus und sendet die Werte per UDP an einen Loxone Miniserver - inklusive Abfrage-Intervallen, HTTP-Triggern fuer Loxone und fertigen Loxone-Vorlagen."
TEXT_2=Eine ausfuehrliche Anleitung findet sich direkt im Plugin unter dem Reiter <strong>Hilfe</strong>.
TEXT_3=Quellcode und weitere Informationen: <a href="https://github.com/RiverRaid/LoxBerry-Plugin-KiaConnect" target="_blank">GitHub-Repository</a>
