<h2>Kia2Lox - Hilfe</h2>
<p>Dieses Plugin liest den Ladezustand eines Kia/Hyundai Elektroautos ueber Kia Connect aus
und sendet die Werte per UDP an einen Loxone Miniserver.</p>
<p>Weitere Informationen: <a href="https://github.com/RiverRaid/LoxBerry-Plugin-KiaConnect" target="_blank">GitHub-Repository</a></p>
